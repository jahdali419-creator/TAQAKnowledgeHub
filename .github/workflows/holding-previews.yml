name: Holding page on preview environments
# Manual only. Replaces the content of the named Azure preview environments
# with the holding page. Nothing is deleted.
on:
  workflow_dispatch:
jobs:
  holding:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ["1", "2", "3"]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string
      - name: Deploy holding page
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_RIVER_0AB0A3310 }}
          action: "upload"
          app_location: "holding"
          api_location: ""
          output_location: "."
          skip_app_build: true
          deployment_environment: ${{ matrix.environment }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
