# Runs the Playwright suite on every push and pull request. This does not
# yet gate the two deploy workflows (pages.yml, the Azure Static Web Apps
# workflow) on a green run here: turning that into an enforced requirement
# needs a branch-protection rule on the repository's default branch (Settings
# -> Branches -> add rule -> "Require status checks to pass" -> select this
# workflow's job), which only a repository admin can set from GitHub's own
# UI or API, not from a workflow file. Until that rule exists, this workflow
# reports a status check on every push/PR, but does not block a deploy by
# itself.
name: Frontend regression tests

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the Playwright suite (Chromium)
        run: npx playwright test --project=chromium

      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # PR 2D (TB-05): a WebKit / iPhone-engine smoke gate, beside the full
  # Chromium suite above, not instead of it. Only specs that pass reliably on
  # WebKit are here (306 of 306 locally at CI concurrency, PR 2D): the
  # installed-app overlays, phone and offline reliability, the release
  # journey, the role gates on the Master List and the desk, navigation and
  # the page smoke test. Specs with known WebKit-only failures that also fail
  # on main before PR 2D are left out and listed in docs/TESTING.md; real
  # iPhone checks stay manual.
  webkit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: iPhone engine (mobile-safari) smoke
        run: >
          npx playwright test --project=mobile-safari --workers=4 --timeout=60000
          tests/smoke.spec.js tests/navigation.spec.js tests/installed-app.spec.js
          tests/phone-reliability.spec.js tests/release-journey.spec.js
          tests/master-list.spec.js tests/dashboard.spec.js

      - name: Desktop WebKit smoke
        run: >
          npx playwright test --project=webkit --workers=4 --timeout=60000
          tests/smoke.spec.js tests/installed-app.spec.js
          tests/phone-reliability.spec.js tests/release-journey.spec.js
          tests/master-list.spec.js tests/dashboard.spec.js

      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 14
