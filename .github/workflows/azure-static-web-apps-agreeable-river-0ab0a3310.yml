name: Azure Static Web Apps CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:
jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Assemble the website files
        # Publish only what the website serves. Project documents, tests,
        # scripts and tooling stay in the repository and are not deployed.
        shell: bash
        run: |
          mkdir -p _site
          git ls-files -z \
            | grep -zvE '^(docs|tests|scripts|holding|config|\.github|\.claude)/|^(README\.md|SECURITY\.md|package\.json|package-lock\.json|playwright\.config\.js|\.gitignore)$' \
            | xargs -0 cp --parents -t _site
          for f in index.html staticwebapp.config.json documents-master.js service-worker.js; do
            test -f "_site/$f" || { echo "Missing $f in the website files"; exit 1; }
          done
          for d in docs tests scripts holding config .github .claude; do
            test ! -e "_site/$d" || { echo "$d must not be deployed"; exit 1; }
          done
          echo "Website files: $(find _site -type f | wc -l)"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_RIVER_0AB0A3310 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "_site" # The website files assembled above (set "holding" to show the holding page instead)
          api_location: "" # Api source code path - optional
          output_location: "." # Built app content directory - optional
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
  holding_previews_job:
    # Manual only: replaces the content of the named preview environments
    # with the holding page. Nothing is deleted.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Holding page on preview environment ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: ["1", "2", "3"]
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Deploy holding page
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_RIVER_0AB0A3310 }}
          action: "upload"
          app_location: "holding"
          api_location: ""
          output_location: "."
          skip_app_build: true
          deployment_environment: ${{ matrix.environment }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
