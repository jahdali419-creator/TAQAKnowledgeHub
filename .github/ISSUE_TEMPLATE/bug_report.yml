name: Report a problem
description: Something in RISE looks wrong, does not work, or is confusing.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting it. Short answers are fine — three lines are more
        useful than none. If you are not sure about a field, leave it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see go wrong?
      placeholder: The page said 1 pending, but the list below said nothing is waiting.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect instead?
      placeholder: Both should show the same number.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What were you doing just before?
      description: The steps, so someone else can see the same thing.
      placeholder: |
        1. Opened RISE
        2. Chose Coiled Tubing
        3. Opened the dashboard
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      options:
        - Blocker — I cannot do my work at all
        - Major — it is wrong, but I found a way around it
        - Minor — it looks wrong, but nothing is broken
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Which role were you using?
      options:
        - Employee
        - Segment Director
        - Maintenance Manager
        - QMS / Document Controller
        - External Auditor
        - I do not know
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Which page, and which segment?
      description: Paste the web address if you can. It tells us exactly where you were.
      placeholder: dashboard.html?id=coiled-tubing

  - type: dropdown
    id: device
    attributes:
      label: What were you using?
      options:
        - Computer
        - Phone
        - Tablet
    validations:
      required: true

  - type: textarea
    id: picture
    attributes:
      label: A picture, if you have one
      description: Drag a screenshot into this box. A picture usually saves an hour.

  - type: checkboxes
    id: again
    attributes:
      label: Does it happen every time?
      options:
        - label: Yes, I tried again and it happened again
        - label: It happened only once
