<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RISE preview</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
         background: #F4F6F6; color: #1A2C2C; font: 400 1.125rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
</style>
</head>
<body>
<p>RISE preview is temporarily unavailable.</p>
<script>
  // Remove any copy of the earlier preview kept on this device.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
  }
  if (window.caches) {
    caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
  }
</script>
</body>
</html>
